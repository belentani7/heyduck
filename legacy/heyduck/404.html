<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Página não encontrada | DUCK</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --accent: #9acb6b; --bg: #0a0a0a; --fg: #f4f4f4; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, #161616 0%, var(--bg) 70%);
      color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center; padding: 2rem;
    }
    .code {
      font-size: clamp(5rem, 20vw, 10rem); font-weight: 800; line-height: .85;
      color: var(--accent); letter-spacing: -.04em; margin: 0;
    }
    h1 { font-size: clamp(1.2rem, 4vw, 1.8rem); margin: 1rem 0 .5rem; }
    p { color: #b9b9b9; max-width: 34ch; margin: 0 auto 2rem; line-height: 1.6; }
    a {
      display: inline-block; padding: .85rem 1.8rem; border-radius: 999px;
      background: var(--accent); color: #0a0a0a; font-weight: 700; text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a:hover, a:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(154,203,107,.35); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Essa faixa não está no setlist</h1>
    <p>A página que você procura não existe ou foi movida. Volte ao estúdio — lá está tudo.</p>
    <a href="./">Voltar ao início</a>
  </main>
</body>
</html>
