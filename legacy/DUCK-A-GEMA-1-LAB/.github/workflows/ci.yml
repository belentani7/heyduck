name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis JavaScript
        run: npm run lint
      - name: Probar servidor local
        run: npm test
      - name: Comprobar sintaxis Python
        run: python -m compileall -q hand_tracking
