name: CodeQL

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # `legacy/` son exportaciones archivadas, no código del producto:
          # analizarlas multiplica el tiempo del job sin proteger nada vivo.
          config: |
            paths-ignore:
              - legacy
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
